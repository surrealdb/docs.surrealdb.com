<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage engine settings</title>
<style>
:root {
	--bg: #ffffff;
	--ink: #19191d;
	--ink2: #4b4b55;
	--line: #e2e2e8;
	--threads: #afa9ec;
	--files: #b4b2a9;
	--compaction: #f0997b;
	--blob: #ed93b1;
	--memory: #5dcaa5;
	--commit: #85b7eb;
	--reads: #fac775;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #15141a; --ink: #ecebf2; --ink2: #b4b2c0; --line: #302f3a;
		--threads: #534ab7; --files: #5f5e5a; --compaction: #993c1d; --blob: #993556;
		--memory: #0f6e56; --commit: #185fa5; --reads: #854f0b; color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #15141a; --ink: #ecebf2; --ink2: #b4b2c0; --line: #302f3a;
	--threads: #534ab7; --files: #5f5e5a; --compaction: #993c1d; --blob: #993556;
	--memory: #0f6e56; --commit: #185fa5; --reads: #854f0b; color-scheme: dark;
}
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
body { padding: 16px 16px 16px; overflow-x: hidden; }
.engine { margin: 0 0 24px; }
.head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.count { font-size: 28px; font-weight: 600; }
.name { font-size: 15px; color: var(--ink2); }
.group { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
.label { width: 128px; flex-shrink: 0; font-size: 13px; color: var(--ink2); }
.tiles { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.tile { width: 16px; height: 16px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--c); }
.tile.faded { background: transparent; border: 1.5px dashed var(--c); }
.tile:hover, .tile:focus-visible, .tile.on { outline: 2px solid var(--ink); outline-offset: 1px; }
#out { min-height: 64px; margin: 4px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
#out-name { font: 13px/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
#out-note { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin: 0 0 16px; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 12px; height: 12px; border-radius: 3px; background: var(--ink2); display: inline-block; }
.key i.faded { background: transparent; border: 1.5px dashed var(--ink2); }
@media (max-width: 380px) {
	.group { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 10px; }
	.label { width: auto; }
}
</style>
</head>
<body>
<main>
<div class="key"><span><i></i>A setting</span><span><i class="faded"></i>No setting needed, select it for the reason</span></div>
<section class="engine" id="rocksdb">
	<div class="head"><span class="count">53</span><span class="name">RocksDB settings</span></div>
</section>
<section class="engine" id="surrealkv">
	<div class="head"><span class="count">10</span><span class="name">SurrealKV settings</span></div>
</section>
<div id="out"><div id="out-name">Hover over or select a square.</div><div id="out-note">A solid square shows an environment variable, and a dashed one shows why no setting is needed there.</div></div>
</main>
<script src="settings.js"></script>
</body>
</html>
