<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start command builder</title>
<style>
:root {
	--bg: #ffffff;
	--card: #f6f6f8;
	--ink: #19191d;
	--ink2: #4b4b55;
	--dim: #80808c;
	--line: #e2e2e8;
	--accent: #9600ff;
	--note-bg: #eef3fb;
	--note-ink: #0c447c;
	--caution-bg: #faeeda;
	--caution-ink: #633806;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #15141a; --card: #1d1c24; --ink: #ecebf2; --ink2: #b4b2c0; --dim: #7d7b8a; --line: #302f3a;
		--accent: #c47bff; --note-bg: #142235; --note-ink: #b5d4f4; --caution-bg: #33240c; --caution-ink: #fac775;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #15141a; --card: #1d1c24; --ink: #ecebf2; --ink2: #b4b2c0; --dim: #7d7b8a; --line: #302f3a;
	--accent: #c47bff; --note-bg: #142235; --note-ink: #b5d4f4; --caution-bg: #33240c; --caution-ink: #fac775;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans); }
body { overflow-x: hidden; }
.output { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.cmd { position: relative; background: var(--card); border-radius: 8px; padding: 12px 64px 12px 12px; font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 44px; }
.copy { position: absolute; top: 8px; right: 8px; font: 12px var(--sans); color: var(--ink2); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.notes { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 150px; overflow-y: auto; }
.notes li { border-radius: 6px; padding: 6px 10px; font-size: 13px; background: var(--note-bg); color: var(--note-ink); }
.notes li.caution { background: var(--caution-bg); color: var(--caution-ink); }
.notes code, label code { font: 12px var(--mono); }
form { padding: 4px 16px 24px; }
fieldset { border: 0; border-bottom: 1px solid var(--line); margin: 0; padding: 14px 0; }
legend { font-weight: 600; padding: 0; margin-bottom: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 6px 0; }
.sub { margin-left: 22px; }
label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input[type="text"], input[type="number"], select { font: 13px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
input[type="text"] { min-width: 0; width: 200px; }
input[type="number"] { width: 80px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="radio"], input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
.hint { color: var(--dim); font-size: 12px; }
details { border-bottom: 1px solid var(--line); padding: 8px 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
summary .count { font-weight: 400; color: var(--accent); margin-left: 6px; }
.adv-title { margin: 18px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
.opt { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin: 8px 0 10px; }
.opt .flag { font: 12px var(--mono); color: var(--ink2); }
.opt input[type="text"] { width: 100%; max-width: 320px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="output">
	<div class="cmd" id="cmd" aria-live="polite"></div>
	<button type="button" class="copy" id="copy">Copy</button>
	<ul class="notes" id="notes"></ul>
</div>
<form id="form" autocomplete="off">
	<fieldset>
		<legend>Storage</legend>
		<div class="row">
			<label><input type="radio" name="engine" value="memory" checked> In memory</label>
			<label><input type="radio" name="engine" value="surrealkv"> SurrealKV</label>
			<label><input type="radio" name="engine" value="rocksdb"> RocksDB</label>
			<label><input type="radio" name="engine" value="tikv"> TiKV</label>
		</div>
		<div id="mem-opts">
			<div class="row"><label><input type="checkbox" id="mem-persist"> Persist to disk</label></div>
			<div class="sub" id="mem-persist-opts" hidden>
				<div class="row"><label>Directory <input type="text" id="mem-path" value="data"></label></div>
				<div class="row">
					<label><input type="checkbox" id="mem-snapshot" checked> Snapshot every</label>
					<input type="number" id="mem-snapshot-secs" value="60" min="1" step="1" aria-label="Snapshot interval in seconds"> <span class="hint">seconds</span>
				</div>
				<div class="row">
					<label><input type="checkbox" id="mem-aol"> Append-only log</label>
					<select id="mem-aol-mode" aria-label="Append-only log mode">
						<option value="sync">sync</option>
						<option value="async">async</option>
					</select>
				</div>
			</div>
		</div>
		<div id="tikv-opts" hidden>
			<div class="row"><label>PD address <input type="text" id="tikv-addr" value="127.0.0.1:2379"></label></div>
			<p class="hint">TiKV suits local multi-node experiments. Its TLS files and garbage collection settings are under Advanced options.</p>
		</div>
		<div id="disk-opts" hidden>
			<div class="row"><label>Path <input type="text" id="disk-path" value="mydatabase.db"></label></div>
			<div class="row">
				<label>Flush to disk
					<select id="sync">
						<option value="every">on every commit (default)</option>
						<option value="interval">at an interval</option>
						<option value="never">left to the OS</option>
					</select>
				</label>
				<span id="sync-interval-wrap" hidden><input type="number" id="sync-secs" value="5" min="1" step="1" aria-label="Flush interval in seconds"> <span class="hint">seconds</span></span>
			</div>
			<div class="row">
				<label><input type="checkbox" id="versioned"> Keep versions for <code>VERSION</code> queries</label>
			</div>
			<div class="row sub" id="retention-wrap" hidden>
				<label>for <input type="number" id="retention-days" value="30" min="0" step="1" aria-label="Retention in days"></label> <span class="hint">days (0 keeps every version)</span>
			</div>
		</div>
	</fieldset>

	<fieldset>
		<legend>Authentication</legend>
		<div class="row">
			<label><input type="radio" name="auth" value="user" checked> Root user</label>
			<label><input type="radio" name="auth" value="none"> No root user</label>
			<label><input type="radio" name="auth" value="unauthenticated"> Unauthenticated</label>
		</div>
		<div class="row sub" id="user-opts">
			<label>Username <input type="text" id="user" value="root" style="width:110px"></label>
			<label>Password <input type="text" id="pass" value="secret" style="width:110px"></label>
		</div>
	</fieldset>

	<fieldset>
		<legend>Network</legend>
		<div class="row">
			<label><input type="radio" name="bind" value="local" checked> This machine only</label>
			<label><input type="radio" name="bind" value="all"> All network interfaces</label>
			<label>Port <input type="number" id="port" value="8000" min="1" max="65535" step="1"></label>
		</div>
		<div class="row"><label><input type="checkbox" id="tls"> Serve over TLS</label></div>
		<div class="row sub" id="tls-opts" hidden>
			<label>Certificate <input type="text" id="tls-crt" value="cert.pem" style="width:120px"></label>
			<label>Key <input type="text" id="tls-key" value="key.pem" style="width:120px"></label>
		</div>
	</fieldset>

	<fieldset>
		<legend>Capabilities</legend>
		<div class="row">
			<label><input type="radio" name="caps" value="default" checked> Defaults</label>
			<label><input type="radio" name="caps" value="deny"> Deny all, then allow</label>
			<label><input type="radio" name="caps" value="allow"> Allow all</label>
		</div>
		<div id="caps-opts">
			<div class="row">
				<label>Outbound network
					<select id="net">
						<option value="off">no access</option>
						<option value="list">only these hosts</option>
						<option value="any">any host</option>
					</select>
				</label>
				<input type="text" id="net-list" value="api.example.com" hidden aria-label="Hosts to allow, separated by commas">
			</div>
			<div class="row" id="funcs-row" hidden>
				<label>Functions
					<select id="funcs">
						<option value="all">all</option>
						<option value="list">only these</option>
					</select>
				</label>
				<input type="text" id="funcs-list" value="string,array,math,time" hidden aria-label="Function families to allow, separated by commas">
			</div>
			<div class="row">
				<label><input type="checkbox" id="scripting"> Embedded scripting</label>
				<label><input type="checkbox" id="guests"> Guest access</label>
				<label><input type="checkbox" id="eval"> <code>eval::surql</code> for system users</label>
			</div>
			<div class="row">
				<span class="hint">Experimental:</span>
				<label><input type="checkbox" id="exp-files"> files</label>
				<label><input type="checkbox" id="exp-surrealism"> surrealism</label>
			</div>
		</div>
	</fieldset>

	<fieldset>
		<legend>Other</legend>
		<div class="row">
			<label>Log level
				<select id="log">
					<option value="info">info (default)</option>
					<option value="warn">warn</option>
					<option value="error">error</option>
					<option value="debug">debug</option>
					<option value="trace">trace</option>
					<option value="none">none</option>
				</select>
			</label>
		</div>
		<div class="row">
			<label><input type="checkbox" id="import"> Import a file on start</label>
			<input type="text" id="import-path" value="schema.surql" hidden aria-label="File to import">
		</div>
	</fieldset>

	<div id="advanced"><p class="adv-title">Advanced options</p></div>
</form>
<script src="builder.js"></script>
</body>
</html>
