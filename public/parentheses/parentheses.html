<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How parentheses resolve</title>
<style>
:root {
	--bg: #ffffff;
	--card: #f6f6f8;
	--ink: #19191d;
	--ink2: #4b4b55;
	--dim: #80808c;
	--line: #e2e2e8;
	--accent: #9600ff;
	--hi-bg: #fdf1d8;
	--hi-line: #c06a00;
	--new-bg: #ddf5ec;
	--new-ink: #0b6e54;
	--d1: #7f3fe0;
	--d2: #0b8f6d;
	--d3: #c8462a;
	--d4: #c42f78;
	--d5: #2a6fd6;
	--d6: #a86400;
	--d7: #4f8a12;
	--d8: #0f7fa0;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #15141a; --card: #1d1c24; --ink: #ecebf2; --ink2: #b4b2c0; --dim: #7d7b8a; --line: #302f3a;
		--accent: #c47bff; --hi-bg: #3a2c12; --hi-line: #f0a34a; --new-bg: #123329; --new-ink: #6fe0bb;
		--d1: #b48cff; --d2: #3cc49c; --d3: #ff8a66; --d4: #ff7fb8; --d5: #6fa8ff; --d6: #f0b04a; --d7: #9bd45a; --d8: #5fd0e8;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #15141a; --card: #1d1c24; --ink: #ecebf2; --ink2: #b4b2c0; --dim: #7d7b8a; --line: #302f3a;
	--accent: #c47bff; --hi-bg: #3a2c12; --hi-line: #f0a34a; --new-bg: #123329; --new-ink: #6fe0bb;
	--d1: #b48cff; --d2: #3cc49c; --d3: #ff8a66; --d4: #ff7fb8; --d5: #6fa8ff; --d6: #f0b04a; --d7: #9bd45a; --d8: #5fd0e8;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
body { padding: 16px 16px 28px; overflow-x: hidden; }
main { max-width: 1000px; margin: 0 auto; }
.tabs, .controls, .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tabs { margin: 0 0 12px; }
button {
	font: 500 13px var(--sans); color: var(--ink2); background: var(--card);
	border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
button:hover { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
.expr {
	font: 400 17px/1.9 var(--mono); background: var(--card); border: 1px solid var(--line);
	border-radius: 10px; padding: 16px; min-height: 80px; white-space: pre-wrap; word-break: break-word;
}
.p { font-weight: 700; }
.p1 { color: var(--d1); } .p2 { color: var(--d2); } .p3 { color: var(--d3); } .p4 { color: var(--d4); }
.p5 { color: var(--d5); } .p6 { color: var(--d6); } .p7 { color: var(--d7); } .p8 { color: var(--d8); }
.call { color: var(--dim); }
.hi { background: var(--hi-bg); outline: 1.5px dashed var(--hi-line); border-radius: 4px; transition: opacity .35s; }
.hi.fade { opacity: .15; }
.new { background: var(--new-bg); color: var(--new-ink); border-radius: 4px; padding: 0 2px; }
.note { color: var(--ink2); font-size: 14px; margin: 10px 2px; min-height: 42px; }
.controls { margin: 4px 0 10px; font-size: 13px; color: var(--ink2); }
.controls .count { margin-left: auto; }
.legend { font-size: 12px; color: var(--ink2); gap: 6px 12px; margin: 0 0 10px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
ol { font: 400 13px/1.8 var(--mono); color: var(--ink2); margin: 0; padding-left: 1.6rem; }
ol li { white-space: pre-wrap; }
ol li.cur { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hi { transition: none; } }
</style>
</head>
<body>
<main>
<div class="tabs" id="tabs" role="group" aria-label="Example"></div>
<div class="expr" id="expr" aria-live="polite"></div>
<p class="note" id="note"></p>
<div class="controls">
<button id="back" aria-label="Previous step">Back</button>
<button id="play">Play</button>
<button id="next" aria-label="Next step">Next</button>
<button id="reset">Reset</button>
<label>Speed <input type="range" id="speed" min="1" max="5" step="1" value="3"></label>
<span class="count" id="count"></span>
</div>
<div class="legend" id="legend"></div>
<ol id="log"></ol>
</main>
<script src="parentheses.js"></script>
</body>
</html>
