name: Re-index docs search

# A squash merge into main arrives as a push to main, and so does a direct push.
# Either way the content the indexer reads has changed, so both should trigger.
#
# The indexer pulls a repository archive from GitHub rather than crawling the
# published site, so this does not wait for the Vercel deployment. A brand-new
# page can therefore appear in search results shortly before its URL is live.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Which API to re-index
        type: choice
        required: true
        default: production
        options:
          - production
          - staging

# The job talks to an external API and never to the GitHub API, so it needs no
# token at all.
permissions: {}

jobs:
  reindex:
    name: Trigger re-index
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # No setup-node and no `bun install`: the script imports only node:crypto
      # and the global fetch, so there is nothing to resolve from node_modules.
      - name: Trigger the re-index
        env:
          DOCS_WEBHOOK_SECRET: ${{ secrets.DOCS_WEBHOOK_SECRET }}
          # A push carries no workflow_dispatch input, so the fallback is what
          # every merge uses.
          REINDEX_URL: >-
            ${{ inputs.environment == 'staging'
              && 'https://api.staging.surrealdb.com/api/docs/v1/reindex'
              || 'https://api.surrealdb.com/api/docs/v1/reindex' }}
        run: bun run search:reindex
