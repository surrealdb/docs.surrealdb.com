name: Stale pages

# A report, not a check. Every Monday it lists the pages whose content has not
# changed for 180 days, in the job summary, so that the docs team can read each
# one again against the product as it is now. It writes nothing back.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staleness:
    name: Stale pages
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A page's date comes from the history of its file
          fetch-depth: 0

      - name: Install dependencies
        run: bun install

      - name: Listing pages unchanged for 180 days
        run: bun run check:staleness
