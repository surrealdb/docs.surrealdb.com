name: CI

on: push

# A new push to a branch supersedes its in-flight run: cancel it rather than
# let every push queue a full set of jobs against the org's runner quota. Runs
# on main are left to finish so each merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun install

      - name: Checking Code Quality
        run: bun run qau

  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run build

  routes:
    name: Route table
    runs-on: ubuntu-latest
    # Reads the checkout and runs a check; it writes nothing back and reaches no
    # Cloudflare account. Cloudflare's own Git integration builds the Worker.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: bun install

      # The Cloudflare Worker applies the `vercel.ts` routing rules itself, from
      # a table compiled at build time. This checks the compile-and-match round
      # trip: normalisation order, a literal rule, a `/:path*` tail, a mid-path
      # parameter, the `/docs` prefix rewrite and the header table.
      - name: Checking the compiled route table
        run: bun run test:routes

  links:
    name: Content checks
    runs-on: ubuntu-latest
    # Reads the checkout and runs a check; it writes nothing back.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Checkout sourcecode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The duplicate check compares the change with the branch it merges into
          fetch-depth: 0

      - name: Install dependencies
        run: bun install

      # A broken link renders and a broken anchor scrolls nowhere, so the build
      # passes either way. This checks every `/docs/...` link and `#anchor` in
      # `src/content` against the pages, server routes and public files that
      # exist, and each anchor against the heading ids the page renders. A
      # link that reaches its page only through a redirect in `redirects.ts`
      # or `vercel.ts` (a moved page, a trailing slash, a `.html` file) or
      # through a folder fails too, with the address to link instead. It
      # reads the repository only, with no network.
      - name: Checking internal links and anchors
        run: bun run check:links

      # Every runnable SurrealQL example carries a test config, which the test
      # runner in the SurrealDB repository reads from the pages. This fails
      # when an example has no config, or its config expects a different
      # result from the one its page shows.
      - name: Checking the doc test configs
        run: bun run check:doc-tests

      # The environment variables page and the command pages are written by
      # hand, and the settings come from the engine source. This compares them
      # with the newest stable release in `public/cli-history/data.json`: a
      # setting with no row, a row for a setting no release has had, a removed
      # setting with no version note, a default that disagrees, and a flag its
      # command's page does not mention. It reads the repository only.
      - name: Checking the CLI reference against the release
        run: bun run check:cli-reference

      # Search indexes the text the crawler extracts from each page. When the
      # extraction finds nothing, the index still builds and search still
      # answers, but only from titles and descriptions. This fails when a
      # fixed sample no longer extracts to the expected text, or a page
      # yields no text.
      - name: Checking that search indexes page text
        run: bun run check:search-text

      # Warns, without failing, when the change makes two pages repeat each
      # other: a new page whose prose mostly appears on another page, or an
      # example copied from another page. Pairs that were already similar
      # before the change are not reported. Each warning is an annotation on
      # the changed file.
      - name: Checking for duplicated pages and examples
        run: bun run check:duplicates

      # Warns, without failing, when a line the change adds breaks a writing
      # rule that `AGENTS.md` states mechanically: a dash, an American
      # spelling, an idiom from its table, a Title Case heading, a wrapped
      # paragraph, the old record ID brackets, `IF ... THEN ... END`, a bare
      # `//` comment, a `Response` title on a SurrealQL result or a `root`
      # password. Lines the change did not touch are not read. Each warning is
      # an annotation on the changed line.
      - name: Checking the content rules
        run: bun run check:content
